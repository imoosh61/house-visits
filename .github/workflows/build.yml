name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project HouseVisits.xcodeproj \
            -scheme HouseVisits \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HouseVisits.app Payload/
          zip -qr HouseVisits.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HouseVisits-ipa
          path: HouseVisits.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: سجل الزيارات - آخر نسخة
          files: HouseVisits.ipa
          make_latest: true
